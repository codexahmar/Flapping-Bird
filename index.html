<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flapping Bird</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <button class="mute-btn" id="muteBtn" title="Toggle Sound">
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        <path class="sound-wave" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        <path class="sound-wave" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </button>

    <button class="pause-btn" id="pauseBtn" title="Pause Game">
      <svg viewBox="0 0 24 24" class="pause-icon">
        <rect x="6" y="4" width="4" height="16"/>
        <rect x="14" y="4" width="4" height="16"/>
      </svg>
      <svg viewBox="0 0 24 24" class="play-icon hidden">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
    </button>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <div class="overlay" id="startScreen">
      <div class="title">FLAPPING BIRD</div>
      <div class="subtitle">A NIGHT ADVENTURE</div>
      <div class="bird-preview">
        <div class="preview-body"></div>
        <div class="preview-eye"></div>
        <div class="preview-beak"></div>
        <div class="preview-wing"></div>
        <div class="preview-tail"></div>
      </div>
      <div class="instruction">PRESS SPACE OR TAP TO START</div>
      <div class="controls-hint">P TO PAUSE</div>
    </div>

    <div class="overlay hidden" id="pauseScreen">
      <div class="pause-title">PAUSED</div>
      <div class="pause-icon-large">
        <svg viewBox="0 0 24 24">
          <rect x="6" y="4" width="4" height="16" fill="#ffd93d"/>
          <rect x="14" y="4" width="4" height="16" fill="#ffd93d"/>
        </svg>
      </div>
      <div class="instruction">PRESS P OR TAP TO RESUME</div>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
      <div class="game-over-title">GAME OVER</div>
      <div class="score-display">SCORE</div>
      <div class="current-score" id="finalScore">0</div>
      <div class="high-score" id="highScoreDisplay">HIGH SCORE: 0</div>
      <div class="instruction">PRESS SPACE OR TAP TO RESTART</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
